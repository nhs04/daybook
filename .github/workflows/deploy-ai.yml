# Installs the AI assistant (supabase/functions/ai) on Supabase whenever its code changes on GitHub.
# Needs one repository secret: SUPABASE_ACCESS_TOKEN (Supabase → Account → Access Tokens).
# Your Anthropic key and ALLOWED_EMAIL stay in Supabase's own secrets; this never touches them.
name: Deploy AI

on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/**"
      - ".github/workflows/deploy-ai.yml"
  workflow_dispatch: {} # lets you run it by hand from the Actions tab

concurrency:
  group: deploy-ai
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      PROJECT_REF: kqcfpxuwxnkulowejger
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Check the access token is set
        id: token
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::warning::SUPABASE_ACCESS_TOKEN isn't set in this repository's secrets yet, so the AI wasn't updated."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: supabase/setup-cli@v1
        if: steps.token.outputs.ok == 'true'
        with:
          version: latest

      - name: Install the AI on Supabase
        if: steps.token.outputs.ok == 'true'
        run: supabase functions deploy ai --project-ref "$PROJECT_REF" --use-api --yes

      - name: Check the AI answers
        if: steps.token.outputs.ok == 'true'
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" -X OPTIONS "https://$PROJECT_REF.supabase.co/functions/v1/ai")
          echo "The AI answered with HTTP $code"
          [ "$code" = "200" ]
